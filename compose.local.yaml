services:
  open-seo:
    image: openseo-local:tokyo
    pull_policy: never
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      target: runtime
    init: true
    user: node
    restart: "no"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||3001)+'/api/health',{signal:AbortSignal.timeout(55000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 60s
      timeout: 60s
      start_interval: 60s
      start_period: 600s
      retries: 3
    # Local checkout mode avoids the production SSR bundle at every recreation.
    # The base Compose file still uses the production scheduler/preview entrypoint.
    command:
      - sh
      - -ec
      - |
        pnpm exec tsx scripts/selfhost-preflight.ts
        pnpm run db:migrate:local
        node scripts/selfhost-runtime-bindings.mjs
        exec pnpm exec vite dev --host 0.0.0.0 --port "$$PORT" --strictPort
    environment:
      NODE_ENV: development
      # Leave room for workerd and other services in a small local Docker VM.
      NODE_OPTIONS: --max-old-space-size=1536
      npm_config_node_options: --max-old-space-size=1536
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
          initial_sync: true
        # Other source/config/dependency changes recreate the dev container.
        # Dependency layers stay cached unless their manifests change.
        - action: rebuild
          path: .
          ignore:
            - src/
            - .git/
            - .github/
            - .claude/
            - .cursor/
            - .agents/
            - .logs/
            - node_modules/
            - web/node_modules/
            - .wrangler/
            - dist/
            - dist-sourcemaps/
            - .tanstack/
            - .env*
            - .dev.vars*
